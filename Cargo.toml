[package]
name = "codexpt"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }
mime_guess = "2"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "migrate", "macros", "uuid", "chrono", "any"] }
tower-http = { version = "0.6", features = ["cors"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
base64 = "0.23.1"
async-trait = "0.1.92"
chacha20poly1305 = "0.11.0"
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
rsa = { version = "0.9.10", features = ["sha2"] }

[lib]
name = "codexpt"
path = "src/lib.rs"

[[bin]]
name = "codexpt"
path = "src/main.rs"
